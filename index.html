<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VerdeBase Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
        }

        /* Header */

        #header {
            background: white;
            padding: 15px 30px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title h1 {
            margin: 0;
            font-size: 42px;
        }

        .title h1 a {
            text-decoration: none;
            color: #2E7D32;

            display: flex;
            align-items: center;
        }

        .logo-icon {
            height: 90px;
            width: auto;
            margin-right: 12px;
        }

       .counter {
        background: #2E7D32;
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 22px;
        font-weight: bold;
        }

        /* Map */

        #map {
            width: 100%;
            height: calc(100vh - 120px);
        }

        /* Popups */

        .leaflet-popup-content {
            width: 420px !important;
            font-size: 20px;
            line-height: 1.5;
        }

        .leaflet-popup-content h3 {
            margin-top: 0;
            color: #2E7D32;
            font-size: 24px;
        }

        .leaflet-popup-content img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div id="header">

    <div class="title">
        <h1>
            <a href="https://verdebase.carrd.co" target="_blank">
                <img src="IMG_3966.png" class="logo-icon">
                VerdeBase
            </a>
        </h1>
    </div>

         <div class="counter">
            🚮 Resíduos: <span id="reportCount">0</span>
        </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([38.565, -8.875], 15);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ===== Meldingen =====

var reports = [

    {
        lat: 38.563100,
        lng: -8.874300,
        title: "Betão e tijolo",
        date: "24-07-2026"
    },
    {
        lat: 38.564200,
        lng: -8.876500,
        title: "Resíduos mistos",
        date: "22-07-2026"
    }

];

// ===== Counter =====

document.getElementById("reportCount").innerText = reports.length;

// ===== Rode marker =====

var redIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',

    iconSize: [50, 82],
    iconAnchor: [25, 82],
    popupAnchor: [0, -76],
    shadowSize: [82, 82]
});

// ===== Markers plaatsen =====

reports.forEach(function(report) {

    L.marker([report.lat, report.lng], {
        icon: redIcon
    })
    .addTo(map)
    .bindPopup(`
        <h3>${report.title}</h3>

        <p>
            <strong>Data do registo:</strong> ${report.date}
        </p>
    `);

});

</script>

</body>
</html>
