<!DOCTYPE html>
<html>
    <head>
    <meta charset="utf-8">
     <title>VerdeBase Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
        }

        /* Header */

        #header {
            background: white;
            padding: 30px 30px 15px 30px;
            box-shadow: 0 2px 10px rgba(0,0,0,.15);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title h1 {
            margin: 0;
            font-size: 42px;
        }

        .title h1 a {
            text-decoration: none;
            color: #2E7D32;

            display: flex;
            align-items: center;
        }

        .logo-icon {
            height: 90px;
            width: auto;
            margin-right: 12px;
        }

       .counter {
        background: #2E7D32;
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 30px;
        font-weight: bold;
        }

        /* Map */

        #map {
            width: 100%;
            height: calc(100vh - 120px);
        }

        /* Popups */

        .leaflet-popup-content {
            width: 420px !important;
            font-size: 20px;
            line-height: 1.5;
        }

        .leaflet-popup-content h3 {
            margin-top: 0;
            color: #2E7D32;
            font-size: 24px;
        }

        .leaflet-popup-content img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        
        /* Grotere zoomknoppen voor mobiel */

        .leaflet-control-zoom {
        margin-left: 20px !important;
        }

        .leaflet-control-zoom a {
            width: 65px !important;
            height: 65px !important;
            line-height: 55px !important;
            font-size: 30px !important;
        }
        
    </style>
</head>

<body>

<div id="header">

    <div class="title">
        <h1>
            <a href="https://verdebase.carrd.co" target="_blank">
                <img src="IMG_3966.png" class="logo-icon">
                VerdeBase
            </a>
        </h1>
    </div>

         <div class="counter">
            🚮 Resíduos: <span id="reportCount">0</span>
        </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

var map = L.map('map').setView([38.565, -8.875], 14);

const CSV_URL = "Form Fields - VBdataset.csv";
    
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ===== GPS gebruiker =====

var userMarker;
var accuracyCircle;

function locateUser() {

    map.locate({
        setView: true,
        maxZoom: 17,
        enableHighAccuracy: true
    });

}

map.on('locationfound', function(e) {

    if (userMarker) {
        map.removeLayer(userMarker);
    }

    if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
    }

    userMarker = L.circleMarker(e.latlng, {
        radius: 20,
        fillColor: '#4285F4',
        color: '#ffffff',
        weight: 3,
        fillOpacity: 1
    }).addTo(map);

    accuracyCircle = L.circle(e.latlng, {
        radius: e.accuracy,
        color: '#4285F4',
        fillColor: '#4285F4',
        fillOpacity: 0.25,
        weight: 1
    }).addTo(map);

});

map.on('locationerror', function() {
    alert('Não foi possível obter a sua localização.');
});

// ===== Meldingen =====

var reports = [];

Papa.parse(CSV_URL, {
    download: true,
    header: true,

    complete: function(results) {

        reports = results.data
            .filter(row => row.latitude && row.longitude)
            .map(row => ({
                id: row.id,
                date: row.date,
                lat: parseFloat(row.latitude),
                lng: parseFloat(row.longitude),
                photos: [
                    row.photo_1,
                    row.photo_2,
                    row.photo_3,
                    row.photo_4,
                    row.photo_5
                ].filter(photo => photo && photo.trim() !== "")
            }));

        console.log(reports);

        // ===== Counter =====
        document.getElementById("reportCount").innerText = reports.length;

        // ===== Rode marker =====
        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            iconSize: [50, 82],
            iconAnchor: [25, 82],
            popupAnchor: [0, -76],
            shadowSize: [82, 82]
        });

        // ===== Markers plaatsen =====
        reports.forEach(function(report) {

            L.marker([report.lat, report.lng], {
                icon: redIcon
            })
            .addTo(map)
            .bindPopup(`
                ${report.photos.length > 0 ? `
                    <img
                        src="${report.photos[0]}"
                        loading="lazy"
                        style="
                            width:100%;
                            max-height:220px;
                            object-fit:cover;
                            border-radius:8px;
                            margin-bottom:12px;
                        ">
                ` : ""}

                <h3>${report.id}</h3>

                <p style="margin:8px 0 0 0;">
                    <strong>Data do registo:</strong><br>
                    ${report.date}
                </p>
            `);

        });

    }
});
    
// ===== GPS knop =====

var gpsControl = L.control({ position: 'topleft' });

gpsControl.onAdd = function() {

    var button = L.DomUtil.create('button');

    button.innerHTML = '📍';
    button.title = 'A minha localização';

    button.style.width = '70px';
    button.style.height = '70px';
    button.style.background = 'white';
    button.style.border = 'none';
    button.style.borderRadius = '8px';
    button.style.fontSize = '34px';
    button.style.cursor = 'pointer';
    button.style.boxShadow = '0 2px 8px rgba(0,0,0,0.3)';
    button.style.marginTop = '20px';
    button.style.marginLeft = '20px';

    L.DomEvent.on(button, 'click', function(e) {
        L.DomEvent.stopPropagation(e);
        locateUser();
        });

    return button;
    };

    gpsControl.addTo(map);

</script>

</body>
</html>
